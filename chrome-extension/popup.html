<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIID Salesforce Session Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SIID Salesforce Session Manager</h1>
    </div>
    
    <div class="content">
      <div id="status" class="status">
        <p>Checking Salesforce session...</p>
      </div>
      
      <div id="info" class="info" style="display: none;">
        <div class="info-row">
          <span class="label">Domain:</span>
          <span id="domain" class="value"></span>
        </div>
        <div class="info-row">
          <span class="label">Session ID:</span>
          <span id="sessionId" class="value session-id"></span>
        </div>
      </div>
      
      <div id="error" class="error" style="display: none;">
        <p id="errorMessage"></p>
      </div>
      
      <div class="actions">
        <button id="openSiid" class="btn btn-primary" style="display: none;">
          Open in SIID
        </button>
        <button id="copySessionId" class="btn btn-secondary" style="display: none;">
          Copy Session ID
        </button>
      </div>
    </div>
    
    <div class="footer">
      <p class="hint">This extension only works on Salesforce domains</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
